name: Verify app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Development browser suites (desktop and compact touch)
        run: npm run test:e2e:release
      - run: npm run build
      - name: Production offline and worker-update checks (already built)
        run: npm run test:production:built
      - name: Upload release evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
